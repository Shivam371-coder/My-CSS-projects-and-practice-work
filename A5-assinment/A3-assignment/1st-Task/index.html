
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="hero">

        <!-- Navbar -->
        <nav class="navbar">

            <div class="logo">
                <span>◯ SQUID</span>
                <span>△ GAME</span>
            </div>

            <ul class="nav-links">
                <li><a href="#">About</a></li>
                <li><a href="#" class="active">Watch now</a></li>
                <li><a href="#">Actors</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <div class="menu">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </nav>

        <!-- Hero Content -->
        <section class="hero-content">

            <div class="left-content">

                <h1>
                    SQUID
                    <br>
                    GAME
                </h1>

                <p>
                    Action / Thriller / Drama Series directed by Dong-hyuk Hwang
                    <br>
                    Season 1: 9 Episodes
                </p>

                <div class="buttons">
                    <a href="#" class="play-btn">
                        <span class="play-icon">▶</span>
                        Play Now
                    </a>

                    <a href="#" class="trailer-btn">
                        <span>▷</span>
                        Watch Trailer
                    </a>
                </div>

            </div>

            <!-- Main Character -->
            <div class="character">
                <img src="images/guard.png" alt="Masked Guard">
            </div>

            <div class="scroll">
                <span>SCROLL</span>
                <div></div>
            </div>

            <!-- Social Links -->
            <div class="social-links">
                <a href="#">♥</a>
                <a href="#">◎</a>
                <a href="#">f</a>
            </div>

        </section>

        <!-- Bottom Cards -->
        <section class="video-cards">

            <div class="video-card">
                <img src="images/card1.jpg" alt="Squid Game">
                <div class="card-overlay">
                    <span>▶</span>
                </div>
            </div>

            <div class="video-card">
                <img src="images/card2.jpg" alt="Squid Game">
                <div class="card-overlay">
                    <span>▶</span>
                </div>
            </div>

            <div class="video-card">
                <img src="images/card3.jpg" alt="Squid Game">
                <div class="card-overlay">
                    <span>▶</span>
                </div>
            </div>
